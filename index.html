<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photocard AR Test</title>


    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
    </script>


    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js">
    </script>


    <style>

        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: black;

        }


        #ar-container {

            width: 100%;

            height: 100%;

            position: relative;

        }


        #start-button {

            position: absolute;

            z-index: 10;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            padding:
                16px 28px;

            font-size: 18px;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

        }

    </style>

</head>


<body>


<div id="ar-container"></div>


<button id="start-button">
    START AR
</button>


<script>


const startButton =
    document.getElementById(
        "start-button"
    );


startButton.addEventListener(
    "click",
    async function () {


        startButton.style.display =
            "none";


        const mindarThree =
            new MINDAR.IMAGE.MindARThree({

                container:
                    document.querySelector(
                        "#ar-container"
                    ),

                imageTargetSrc:
                    "./targets.mind",

                maxTrack: 1

            });


        const renderer =
            mindarThree.renderer;

        const scene =
            mindarThree.scene;

        const camera =
            mindarThree.camera;


        const anchor =
            mindarThree.addAnchor(0);


        const geometry =
            new THREE.BoxGeometry(
                0.3,
                0.3,
                0.3
            );


        const material =
            new THREE.MeshNormalMaterial();


        const cube =
            new THREE.Mesh(
                geometry,
                material
            );


        anchor.group.add(cube);


        await mindarThree.start();


        renderer.setAnimationLoop(
            function () {


                cube.rotation.x +=
                    0.01;


                cube.rotation.y +=
                    0.01;


                renderer.render(
                    scene,
                    camera
                );

            }
        );

    }

);


</script>


</body>

</html>
