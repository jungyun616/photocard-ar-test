<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photocard AR Test</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
        enabled: false
    "

>


    <!-- CAMERA -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false
        "

    ></a-camera>


    <!-- IMAGE TARGET -->

    <a-entity

        mindar-image-target="
            targetIndex: 0
        "

    >


        <!-- 3D MODEL -->

        <a-gltf-model

            id="character"

            src="./model.glb"

            position="
                0
                0
                0
            "

            scale="
                0.1
                0.1
                0.1
            "

            rotation="
                0
                0
                0
            "

        ></a-gltf-model>


    </a-entity>


</a-scene>


<script>


const character =
    document.querySelector(
        "#character"
    );


/*
====================================
WHEN GLB IS LOADED
====================================
*/

character.addEventListener(
    "model-loaded",
    function () {

        console.log(
            "GLB LOADED"
        );


        const model =
            character.getObject3D(
                "mesh"
            );


        if (!model) {

            console.error(
                "MODEL OBJECT NOT FOUND"
            );

            return;

        }


        /*
        ================================
        FIND ANIMATIONS
        ================================
        */

        const animations =
            model.animations;


        console.log(
            "ANIMATIONS:",
            animations
        );


        if (
            !animations ||
            animations.length === 0
        ) {

            console.log(
                "NO ANIMATION FOUND"
            );

            return;

        }


        /*
        ================================
        CREATE ANIMATION MIXER
        ================================
        */

        const mixer =
            new THREE.AnimationMixer(
                model
            );


        /*
        ================================
        PLAY FIRST ANIMATION
        ================================
        */

        const action =
            mixer.clipAction(
                animations[0]
            );


        action.play();


        /*
        ================================
        LOOP ANIMATION
        ================================
        */

        action.setLoop(
            THREE.LoopRepeat,
            Infinity
        );


        /*
        ================================
        UPDATE MIXER
        ================================
        */

        let previousTime =
            performance.now();


        function animate() {

            const currentTime =
                performance.now();


            const delta =
                (
                    currentTime -
                    previousTime
                ) / 1000;


            previousTime =
                currentTime;


            mixer.update(
                delta
            );


            requestAnimationFrame(
                animate
            );

        }


        animate();


        console.log(
            "ANIMATION STARTED"
        );

    }
);


/*
====================================
TARGET FOUND
====================================
*/

const target =
    document.querySelector(
        "[mindar-image-target]"
    );


target.addEventListener(
    "targetFound",
    function () {

        console.log(
            "TARGET FOUND"
        );

    }
);


target.addEventListener(
    "targetLost",
    function () {

        console.log(
            "TARGET LOST"
        );

    }
);


</script>


</body>

</html>
