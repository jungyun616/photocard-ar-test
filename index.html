<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photocard AR Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- GLB 애니메이션 재생 컴포넌트 -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- ============================================
         떨림 보정 컴포넌트 (smooth-follow)
         카메라가 인식한 카드 위치를 그대로 따라가지 않고,
         부드럽게 뒤따라가도록 만들어서 흔들림을 줄여줌
         ============================================ -->
    <script>
        AFRAME.registerComponent('smooth-follow', {
            schema: {
                target: { type: 'selector' },
                // 숫자가 작을수록 더 부드럽지만 반응이 느려짐
                // 숫자가 클수록 반응은 빠르지만 흔들림이 더 보임
                amount: { type: 'number', default: 0.2 }
            },

            init: function () {
                this.currentPos = new THREE.Vector3();
                this.currentQuat = new THREE.Quaternion();
                this.initialized = false;

                // 카드를 처음 찾았을 때만 보이게, 놓치면 숨김
                this.data.target.addEventListener('targetFound', () => {
                    this.el.setAttribute('visible', true);
                });
                this.data.target.addEventListener('targetLost', () => {
                    this.el.setAttribute('visible', false);
                });
                this.el.setAttribute('visible', false);
            },

            tick: function () {
                const targetObj = this.data.target.object3D;
                const myObj = this.el.object3D;

                const targetPos = new THREE.Vector3();
                const targetQuat = new THREE.Quaternion();
                const targetScale = new THREE.Vector3();

                targetObj.matrixWorld.decompose(targetPos, targetQuat, targetScale);

                if (!this.initialized) {
                    this.currentPos.copy(targetPos);
                    this.currentQuat.copy(targetQuat);
                    this.initialized = true;
                }

                this.currentPos.lerp(targetPos, this.data.amount);
                this.currentQuat.slerp(targetQuat, this.data.amount);

                myObj.position.copy(this.currentPos);
                myObj.quaternion.copy(this.currentQuat);
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            filterMinCF: 0.0005;
            filterBeta: 100;
            missTolerance: 5;
            warmupTolerance: 5;
        "
        color-space="sRGB"
        renderer="physicallyCorrectLights: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-assets>
            <a-asset-item id="avatarModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <!-- 빛이 없으면 캐릭터가 너무 어둡게 나올 수 있어서 추가함 -->
        <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
        <a-entity light="type: directional; intensity: 0.6;" position="0 1 1"></a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 카드 인식 앵커. 이 자체는 화면에 안 보이고, 위치 정보만 제공함 -->
        <a-entity id="anchor" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 캐릭터는 anchor를 부드럽게 뒤따라감 (smooth-follow) -->
        <a-entity
            id="character"
            smooth-follow="target: #anchor; amount: 0.2"
        >
            <a-entity
                gltf-model="#avatarModel"
                position="0 -0.2 0"
                scale="0.25 0.25 0.25"
                rotation="0 0 0"
                animation-mixer="clip: Animation; loop: repeat;"
            ></a-entity>
        </a-entity>

    </a-scene>

</body>

</html>
