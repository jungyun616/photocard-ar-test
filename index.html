<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photocard AR Test</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- 떨림 보정용 스무딩 컴포넌트 -->
    <script>
        AFRAME.registerComponent('smooth-follow', {
            schema: {
                target: { type: 'selector' },
                amount: { type: 'number', default: 0.3 }
            },

            init: function () {
                this.currentPos = new THREE.Vector3();
                this.currentQuat = new THREE.Quaternion();
                this.initialized = false;
            },

            tick: function () {
                const targetObj = this.data.target.object3D;
                const myObj = this.el.object3D;

                // 카드를 못 찾은 상태면 캐릭터도 같이 숨김
                myObj.visible = targetObj.visible;
                if (!targetObj.visible) return;

                const targetPos = new THREE.Vector3();
                const targetQuat = new THREE.Quaternion();
                const targetScale = new THREE.Vector3();

                targetObj.matrixWorld.decompose(targetPos, targetQuat, targetScale);

                if (!this.initialized) {
                    this.currentPos.copy(targetPos);
                    this.currentQuat.copy(targetQuat);
                    this.initialized = true;
                }

                this.currentPos.lerp(targetPos, this.data.amount);
                this.currentQuat.slerp(targetQuat, this.data.amount);

                myObj.position.copy(this.currentPos);
                myObj.quaternion.copy(this.currentQuat);
            }
        });
    </script>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        filterMinCF: 0.001;
        filterBeta: 5;
        missTolerance: 5;
        warmupTolerance: 5;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
        enabled: false
    "

>


    <!-- CAMERA -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false
        "

    ></a-camera>


    <!-- 카드 인식 전용 (화면에 안 보임) -->
    <a-entity
        id="anchor"
        mindar-image-target="targetIndex: 0"
    ></a-entity>


    <!-- 캐릭터는 anchor를 부드럽게 따라감 -->
    <a-entity
        id="character-wrapper"
        smooth-follow="target: #anchor; amount: 0.3"
    >

        <!-- 3D MODEL (여긴 원래 코드랑 완전히 똑같음) -->

        <a-gltf-model

            id="character"

            src="./model.glb"

            position="
                0
                0
                0
            "

            scale="
                0.1
                0.1
                0.1
            "

            rotation="
                0
                0
                0
            "

        ></a-gltf-model>

    </a-entity>


</a-scene>


<script>


const character =
    document.querySelector(
        "#character"
    );


/*
====================================
WHEN GLB IS LOADED
====================================
*/

character.addEventListener(
    "model-loaded",
    function () {

        console.log(
            "GLB LOADED"
        );


        const model =
            character.getObject3D(
                "mesh"
            );


        if (!model) {

            console.error(
                "MODEL OBJECT NOT FOUND"
            );

            return;

        }


        /*
        ================================
        FIND ANIMATIONS
        ================================
        */

        const animations =
            model.animations;


        console.log(
            "ANIMATIONS:",
            animations
        );


        if (
            !animations ||
            animations.length === 0
        ) {

            console.log(
                "NO ANIMATION FOUND"
            );

            return;

        }


        /*
        ================================
        CREATE ANIMATION MIXER
        ================================
        */

        const mixer =
            new THREE.AnimationMixer(
                model
            );


        /*
        ================================
        PLAY FIRST ANIMATION
        ================================
        */

        const action =
            mixer.clipAction(
                animations[0]
            );


        action.play();


        /*
        ================================
        LOOP ANIMATION
        ================================
        */

        action.setLoop(
            THREE.LoopRepeat,
            Infinity
        );


        /*
        ================================
        UPDATE MIXER
        ================================
        */

        let previousTime =
            performance.now();


        function animate() {

            const currentTime =
                performance.now();


            const delta =
                (
                    currentTime -
                    previousTime
                ) / 1000;


            previousTime =
                currentTime;


            mixer.update(
                delta
            );


            requestAnimationFrame(
                animate
            );

        }


        animate();


        console.log(
            "ANIMATION STARTED"
        );

    }
);


/*
====================================
TARGET FOUND
====================================
*/

const target =
    document.querySelector(
        "[mindar-image-target]"
    );


target.addEventListener(
    "targetFound",
    function () {

        console.log(
            "TARGET FOUND"
        );

    }
);


target.addEventListener(
    "targetLost",
    function () {

        console.log(
            "TARGET LOST"
        );

    }
);


</script>


</body>

</html>
