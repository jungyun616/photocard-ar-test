<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photocard AR Test</title>


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.5.0/aframe.min.js">
    </script>


    <!-- MindAR for A-Frame -->
    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

        }

    </style>

</head>


<body>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
        enabled: false
    "

>


    <!-- CAMERA -->

    <a-camera

        position="0 0 0"

        look-controls="
            enabled: false
        "

    ></a-camera>


    <!-- IMAGE TARGET -->

    <a-entity
        mindar-image-target="
            targetIndex: 0
        "
    >


        <!-- TEST TEXT -->

        <a-text

            value="MODEL TEST"

            position="
                -0.5
                0.5
                0
            "

            color="white"

            align="center"

            width="2"

        ></a-text>


        <!-- 3D MODEL -->

        <a-entity

            id="model"

            gltf-model="./model.glb"

            position="
                0
                0
                0
            "

            scale="
                1
                1
                1
            "

            rotation="
                0
                0
                0
            "

        ></a-entity>


    </a-entity>


</a-scene>


<script>


/*
====================================
AR READY
====================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "PAGE LOADED"
        );

    }
);


/*
====================================
A-FRAME SCENE
====================================
*/

const scene =
    document.querySelector(
        "a-scene"
    );


scene.addEventListener(
    "loaded",
    function () {

        console.log(
            "A-FRAME SCENE LOADED"
        );

    }
);


/*
====================================
GLB MODEL
====================================
*/

const model =
    document.querySelector(
        "#model"
    );


model.addEventListener(
    "model-loaded",
    function () {

        console.log(
            "================================"
        );

        console.log(
            "SUCCESS: GLB MODEL LOADED"
        );

        console.log(
            "================================"
        );

    }
);


model.addEventListener(
    "model-error",
    function (event) {

        console.error(
            "================================"
        );

        console.error(
            "ERROR: GLB MODEL FAILED"
        );

        console.error(
            event
        );

        console.error(
            "================================"
        );

    }
);


/*
====================================
MINDAR EVENTS
====================================
*/

const target =
    document.querySelector(
        "[mindar-image-target]"
    );


target.addEventListener(
    "targetFound",
    function () {

        console.log(
            "TARGET FOUND"
        );

    }
);


target.addEventListener(
    "targetLost",
    function () {

        console.log(
            "TARGET LOST"
        );

    }
);


/*
====================================
MINDAR READY
====================================
*/

scene.addEventListener(
    "arReady",
    function () {

        console.log(
            "AR READY"
        );

    }
);


scene.addEventListener(
    "arError",
    function (event) {

        console.error(
            "AR ERROR"
        );

        console.error(
            event
        );

    }
);


</script>


</body>

</html>
